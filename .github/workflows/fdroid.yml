name: F-Droid Repo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.0.49)
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Install fdroidserver and Android tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner zipalign python3-venv
          python3 -m venv "$RUNNER_TEMP/fdroid-venv"
          "$RUNNER_TEMP/fdroid-venv/bin/pip" install --quiet fdroidserver
          echo "$RUNNER_TEMP/fdroid-venv/bin" >> "$GITHUB_PATH"

      - name: Fetch FOSS APK from the release
        run: |
          set -eo pipefail
          mkdir -p fdroid/repo
          curl -fsSL -o "fdroid/repo/opencode-mobile-fdroid-${{ steps.meta.outputs.tag }}.apk" \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/opencode-mobile-fdroid.apk"

      - name: Decode repo signing keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          set -eo pipefail
          printf '%s' "$FDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > fdroid/repo.keystore
          test -s fdroid/repo.keystore

      - name: Append signing passwords to config
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        run: |
          set -eo pipefail
          {
            echo "keystorepass: $(printf '%s' "$FDROID_KEYSTORE_PASS" | sed 's/"/\\"/g')"
            echo "keypass: $(printf '%s' "$FDROID_KEY_PASS" | sed 's/"/\\"/g')"
          } >> fdroid/config.yml

      - name: Update repository index
        working-directory: fdroid
        run: fdroid update --create-metadata

      # Publish only the signed repo (never config.yml or the keystore).
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          destination_dir: fdroid/repo
